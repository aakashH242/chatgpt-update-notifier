# Release notes use this simple shape so the Bash updater can display them without a YAML parser.
releases:
  - version: 1.2.0
    changes:
      - Exact package rollback copies with CLI, notification, and application-menu restore flows
      - Configurable rollback retention from one to 1000 versions, or unlimited
      - Native and terminal manager action to clear dismissed update versions
      - Notifier update check and changelog-driven update action in both managers
      - Optional native kdialog or zenity manager with a terminal fallback
      - Verified rollback results, Arch signatures, and protection against concurrent package operations
  - version: 1.1.0
    changes:
      - Configurable desktop notification sounds, enabled by default
  - version: 1.0.0
    changes:
      - Initial ChatGPT desktop update checks for Ubuntu, Debian, Fedora, and Arch
      - Interactive user install with per-version silence and optional one-click upgrades
      - Notifier release checks, confirmed self-update, and config warnings
      - Configurable close, force-close consent, restart, and failure recovery for a running ChatGPT app
