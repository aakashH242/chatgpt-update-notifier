# Release notes use this simple shape so the Bash updater can display them without a YAML parser.
releases:
  - version: 1.2.3
    changes:
      - Manual checks no longer bring back a ChatGPT update you silenced; they tell you which available version is silenced
      - Open Manage silences in the control panel to unsilence ChatGPT or notifier versions individually, or clear them all
  - version: 1.2.2
    changes:
      - Fedora can now recover a missing rollback copy from an exact, signed ChatGPT RPM already in your user cache
      - Fedora keeps newly downloaded ChatGPT RPMs so future updates can create rollback copies reliably
  - version: 1.2.1
    changes:
      - Smoother native manager windows with adaptive sizing, clear Select and Cancel buttons, and discoverable double-click selection
  - version: 1.2.0
    changes:
      - Roll back to previous versions if installed ChatGPT version is unstable
      - Control panel for updates, rollback, clearing silences, changing settings and updating the notifier
  - version: 1.1.0
    changes:
      - Configurable desktop notification sounds, enabled by default
  - version: 1.0.0
    changes:
      - Initial ChatGPT desktop update checks for Ubuntu, Debian, Fedora, and Arch
      - Interactive user install with per-version silence and optional one-click upgrades
      - Notifier release checks, confirmed self-update, and config warnings
      - Configurable close, force-close consent, restart, and failure recovery for a running ChatGPT app
